version: 4.4.1.{build}

image: Visual Studio 2026
clone_depth: 5

environment:
  matrix:
    - platform: x86
      configuration: Debug
    - platform: x86
      configuration: Release

matrix:
  fast_finish: false

cache:
  - '%LocalAppData%\NuGet\v3-cache'

build_script:
  - cmd: dotnet --info
  - cmd: dotnet restore shadowsocks-windows.sln
  - cmd: dotnet build shadowsocks-windows.sln -c %configuration% -p:Platform=x86 --no-restore

test_script:
  - cmd: dotnet test test\ShadowsocksTest.csproj -c %configuration% -p:Platform=x86 --no-build

after_build:
  - ps: |
      if ($env:CONFIGURATION -ne "Release") { return }

      $publishDir = Join-Path $env:APPVEYOR_BUILD_FOLDER "working\publish"
      $zipFile = Join-Path $env:APPVEYOR_BUILD_FOLDER "working\Shadowsocks-$env:APPVEYOR_BUILD_VERSION.zip"
      $hashFile = "$zipFile.sha256"

      dotnet publish "$env:APPVEYOR_BUILD_FOLDER\shadowsocks-csharp\shadowsocks-csharp.csproj" `
        -c Release -p:Platform=x86 -p:PublishProfile=FolderProfile `
        -o $publishDir --no-restore
      if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE" }

      if (Test-Path $zipFile) { Remove-Item $zipFile -Force }
      Compress-Archive -Path "$publishDir\*" -DestinationPath $zipFile -CompressionLevel Optimal
      (Get-FileHash $zipFile -Algorithm SHA256).Hash | Out-File -FilePath $hashFile -Encoding ascii

      Push-AppveyorArtifact $zipFile
      Push-AppveyorArtifact $hashFile
