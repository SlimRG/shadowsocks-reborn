name: CI

on:
  push:
    branches: [main, v4]
  pull_request:
    branches: [main, v4]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate repository resources
        shell: pwsh
        run: .\packaging\Validate-Repository.ps1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: .NET info
        run: dotnet --info

      - name: Restore Core standalone
        run: dotnet restore .\Shadowsocks.Core\Shadowsocks.Core.csproj

      - name: Build Core standalone
        run: dotnet build .\Shadowsocks.Core\Shadowsocks.Core.csproj -c Release --no-restore

      - name: Restore
        run: dotnet restore .\shadowsocks-reborn.sln -p:Platform=x64 -r win-x64

      - name: Build
        run: dotnet build .\shadowsocks-reborn.sln -c Release -p:Platform=x64 -m:1 --no-restore

      - name: Test
        run: dotnet test .\Shadowsocks.UnitTests\Shadowsocks.UnitTests.csproj -c Release -p:Platform=x64 --no-build

      - name: Restore publish runtime
        run: dotnet restore .\Shadowsocks.WinUI\Shadowsocks.WinUI.csproj -p:Platform=x64 -p:PublishProfile=FolderProfile -r win-x64

      - name: Publish
        run: dotnet publish .\Shadowsocks.WinUI\Shadowsocks.WinUI.csproj -c Release -p:Platform=x64 -p:PublishProfile=FolderProfile -r win-x64 --self-contained true -o .\artifacts\publish --no-restore

      - name: Validate publish
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publish = Join-Path $PWD 'artifacts\publish'
          if (-not (Test-Path (Join-Path $publish 'Shadowsocks.exe'))) {
            throw "Missing required publish artifact: Shadowsocks.exe"
          }
          $entries = @(Get-ChildItem -LiteralPath $publish -Force)
          if ($entries.Count -ne 1 -or $entries[0].PSIsContainer -or $entries[0].Name -ne 'Shadowsocks.exe') {
            throw "Final product publish must contain exactly Shadowsocks.exe. Found: $($entries.Name -join ', ')"
          }
          foreach ($name in @('Shadowsocks.NetworkService.exe', 'Shadowsocks.NetworkService.dll', 'Shadowsocks.NetworkService.deps.json', 'Shadowsocks.NetworkService.runtimeconfig.json', 'Shadowsocks.pdb', 'privoxy.exe', 'sysproxy.exe', 'sysproxy64.exe', 'libsscrypto.dll', 'gui-config.json')) {
            if (Test-Path (Join-Path $publish $name)) {
              throw "Forbidden publish sidecar found: $name"
            }
          }

      - name: Upload publish artifact
        uses: actions/upload-artifact@v7
        with:
          name: shadowsocks-reborn-win-x64
          path: artifacts/publish/
          if-no-files-found: error
