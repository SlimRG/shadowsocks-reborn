name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: Package version label, for example 5.2.22
        required: true
        default: 5.2.22

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parseFailures = @(
            foreach ($script in Get-ChildItem -LiteralPath .\packaging -Filter *.ps1 -File) {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors)
              foreach ($parseError in @($errors)) {
                '{0}:{1}:{2}: {3}' -f $script.Name, $parseError.Extent.StartLineNumber, $parseError.Extent.StartColumnNumber, $parseError.Message
              }
            }
          )
          if ($parseFailures.Count -gt 0) {
            $failureText = $parseFailures -join [Environment]::NewLine
            throw "PowerShell parser validation failed:`n$failureText"
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.303

      - name: Resolve version label
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            "label=${{ inputs.version }}" >> $env:GITHUB_OUTPUT
          } else {
            "label=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          }

      - name: Build release package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.label }}
          NuGetAudit: 'true'
          NuGetAuditMode: 'all'
        run: .\packaging\Build-Release.ps1 -Version $env:RELEASE_VERSION

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shadowsocks-reborn-${{ steps.version.outputs.label }}-win-x64
          path: |
            artifacts/release/*.zip
            artifacts/release/*.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem .\artifacts\release\*.zip | Select-Object -First 1
          $hash = Get-ChildItem .\artifacts\release\*.sha256 | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME $zip.FullName $hash.FullName --title "shadowsocks-reborn $env:GITHUB_REF_NAME" --generate-notes --verify-tag --draft
